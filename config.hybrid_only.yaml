# Alternate serving-candidate config: HYBRID ALONE (no cross-encoder rerank).
#
# Identical to config.yaml in every respect EXCEPT `reranker_enabled: false`, so the
# resulting eval row isolates exactly one change - the same one-change-one-measurement
# discipline used throughout Phase 3.
#
# Motivation (Phase 4 profiling): the cross-encoder rerank costs ~39 s of the
# champion's ~41.5 s end-to-end latency while buying no measurable rank-1 quality
# (recall@1 81% vs 80%, MRR 0.890 vs 0.891 - both inside the declared noise band).
# This config exists to measure whether GENERATION quality (correctness /
# faithfulness / refusal) survives dropping it, since retrieval metrics alone cannot
# answer that: the reranker's one real gain is recall@3 (100% -> 97%), and passages
# ranked 2-3 still enter the generator's context at top_k=5.
#
# Run:  python -m src.eval.run --config config.hybrid_only.yaml

corpus:
  search_api: "https://www.gov.uk/api/search.json"
  base_url: "https://www.gov.uk"
  published_after: "2022-01-01"
  published_before: "2026-07-01"
  max_articles: 200

chunk:
  strategy: "fixed"
  size_tokens: 512
  overlap_tokens: 50
  child_size_tokens: 128
  child_overlap_tokens: 16
  header_min_section_tokens: 64

embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  query_prefix: "Represent this sentence for searching relevant passages: "

retriever:
  type: "hybrid"
  top_k: 5
  rrf_k: 60
  reranker_enabled: false   # <-- THE ONLY CHANGE vs config.yaml (champion)
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_n: 50

llm:
  provider: "anthropic"
  model: "claude-haiku-4-5"
  temperature: 0.0
  max_tokens: 800
  judge_model: "claude-sonnet-4-6"
