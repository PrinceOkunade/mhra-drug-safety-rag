# Streamlit theme - forced LIGHT mode + a calm clinical palette matching the static demo.
# Native colours (buttons, expanders, metrics) come from here; the Inter font, hero,
# and custom classes are layered on via CSS in streamlit_app.py.
[theme]
base = "light"
primaryColor = "#2563EB"             # blue accent (buttons, links, focus)
backgroundColor = "#F6F8FB"          # soft off-white canvas
secondaryBackgroundColor = "#FFFFFF" # cards / widgets
textColor = "#16202E"                # dark slate for comfortable reading on light
font = "sans serif"
